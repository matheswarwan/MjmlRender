<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="CodeMirror/codemirror.js"></script>
    <link rel="stylesheet" href="CodeMirror/codemirror.css" />
    <link rel="stylesheet" href="CodeMirror/css/foldgutter.css" />
    <script src="js/mjml.js"></script>
    <script src="js/blocksdk.js"></script>
    <script src="CodeMirror/mode/javascript/javascript.js"></script>
    <script src="CodeMirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="CodeMirror/mode/css/css.js"></script>
    <script src="CodeMirror/mode/xml/xml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.6/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.6/beautify-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.6/beautify-html.min.js"></script>
    <style>
      .btn {
        background: #0070d2;
        color: #fff;
        box-shadow: none;
        outline: None;
        display: inline-block;
        margin-bottom: 0;
        font-weight: regular;
        text-align: center;
        vertical-align: middle;
        line-height: 1;
        cursor: pointer;
        background-image: none;
        box-shadow: none;
        white-space: nowrap;
        border: 0;
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 3px;
      }
      .alert {
        background-color: 10px;
        font-size: 12px;
        border-radius: 0.25rem;
        padding: 6px 5px 6px 5px;
        min-width: rem(480px);
        position: relative;
        font-weight: 300;
        border: none;
        color: #a94442;
        box-sizing: border-box;
        display: none;
      }
      .alertmessage {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
        font-size: 12px;
        display: inline-block;
        text-align: left;
        word-break: break-word;
        font-family: Arial;
        box-sizing: border-box;
        color: #fff;
        background-color: #c23934;
        border: 1px solid #999999;
        padding: 5px;
      }
      textarea {
        width: 100%;
      }
      .btn-secondary {
        background: #fff;
        color: #0070d2;
        border: 1px solid #c9c9c9;
        margin-left: 4px;
      }
      .note {
        font: 12px Arial;
        color: #3e3e3c;
        margin-left: 6px;
      }
      .output {
        font: 12px Arial;
        color: #3e3e3c;
        padding-top: 8px;
      }
      .output select {
        font: 12px Arial;
        margin-left: 4px;
      }
      .output summary {
        cursor: pointer;
        margin-top: 6px;
        color: #0070d2;
      }
      .output details label {
        display: block;
        margin: 4px 0 0 4px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .page {
        box-sizing: border-box;
        height: 100%;
        padding: 8px;
        display: flex;
        flex-direction: column;
      }
      .textwrapper {
        flex: 1 1 auto;
        min-height: 160px;
        border: 1px solid #999999;
        margin: 5px 0;
        padding: 3px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="textwrapper">
        <textarea
          style="width: 100%; height: 80%"
          placeholder="Enter MJML Source Code"
          id="editing"
          spellcheck="true"
        ></textarea>
      </div>
      <div style="padding-top: 5px">
        <div class="alert" id="alertBox">
          <div style="width: 100%" class="alertmessage">
            <span class="close" style="float: right; position: relative; top: 3px; right: 3px">&times;</span>
            <div style="top: 10px" id="errorMsg"></div>
          </div>
        </div>
      </div>
      <div style="padding-top: 5px">
        <div>
          <input class="btn" type="button" value="Generate" id="renderBtn" />
          <input class="btn btn-secondary" type="button" value="Copy HTML" id="copyBtn" />
          <span id="copyNote" class="note"></span>
        </div>
      </div>
      <div class="output">
        <label for="outputMode">Output</label>
        <select id="outputMode">
          <option value="email">Whole email: everything MJML adds (default)</option>
          <option value="part">Part of an email: body and column CSS only</option>
          <option value="custom" disabled>Custom</option>
        </select>
        <details>
          <summary>Choose what the block adds</summary>
          <label><input type="checkbox" id="opt-reset" /> Reset CSS for body, table, img and p (applies to the whole email)</label>
          <label><input type="checkbox" id="opt-outlook" /> Outlook settings and column fix</label>
          <label><input type="checkbox" id="opt-fonts" /> Font links (Google Fonts, and Ubuntu, MJML's default)</label>
          <label><input type="checkbox" id="opt-media" /> Column media queries (columns side by side on wide screens)</label>
          <label><input type="checkbox" id="opt-wrapper" /> Body wrapper with the mj-body background colour</label>
        </details>
      </div>
    </div>
  </body>
  <script src="js/helper.js"></script>
  <script src="CodeMirror/js/foldcode.js"></script>
  <script src="CodeMirror/js/foldgutter.js"></script>
  <script src="CodeMirror/js/brace-fold.js"></script>
  <script src="CodeMirror/js/xml-fold.js"></script>
  <script src="CodeMirror/js/indent-fold.js"></script>
  <script src="CodeMirror/js/markdown-fold.js"></script>
  <script src="CodeMirror/js/comment-fold.js"></script>
  <script src="CodeMirror/js/markdown.js"></script>
</html>
